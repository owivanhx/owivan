<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>owiwan</title>
    <link rel="icon" type="image/x-icon" href="kaitoicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-body: #ffffff;
            --bg-window: #ffffff;
            --text-main: #333333;
            --text-date: #888888;
            --border-color: #e0e0e0;
            --highlight-bg: #333333;
            --highlight-text: #ffffff;
            --spotify-green: #1db954;
        }

        body.dark-mode {
            --bg-body: #121212;
            --bg-window: #1e1e1e;
            --text-main: #e0e0e0;
            --text-date: #aaaaaa;
            --border-color: #333333;
            --highlight-bg: #ffffff;
            --highlight-text: #121212;
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg-body);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-main);
            transition: background 0.3s ease;
        }

        /* Widget de Calendário (Canto Superior Esquerdo) */
        .calendar-widget {
            position: fixed;
            top: 20px;
            left: 20px;
            background: var(--bg-window);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 220px;
            text-align: center;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .calendar-header {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            text-transform: capitalize;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            font-size: 11px;
        }

        .calendar-day-name {
            font-weight: 600;
            color: var(--text-date);
            padding-bottom: 4px;
        }

        .calendar-day {
            padding: 5px 0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .calendar-day.today {
            background-color: var(--highlight-bg);
            color: var(--highlight-text);
            font-weight: bold;
        }

        /* Widget de Status Spotify (Canto Superior Direito) */
        .spotify-widget {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--bg-window);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 240px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .spotify-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-date);
            font-weight: 600;
        }

        .spotify-header i {
            color: var(--spotify-green);
            font-size: 14px;
        }

        .spotify-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .spotify-cover {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            object-fit: cover;
            background: var(--border-color);
        }

        .spotify-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            width: 100%;
        }

        .spotify-title {
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .spotify-artist {
            font-size: 11px;
            color: var(--text-date);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .spotify-progress-bar {
            width: 100%;
            height: 3px;
            background: var(--border-color);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 4px;
        }

        .spotify-progress {
            height: 100%;
            background: var(--spotify-green);
            width: 0%;
            transition: width 0.5s linear;
        }

        /* Card Central */
        .window {
            width: 500px;
            background: var(--bg-window);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 1px solid var(--border-color);
            overflow: hidden;
            text-align: center;
            padding-bottom: 20px;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .top-bar {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .dots { display: flex; gap: 6px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .red { background: #ff5f56; }
        .yellow { background: #ffbd2e; }
        .green { background: #27c93f; }

        .search-bar {
            background: var(--border-color);
            margin: 0 auto;
            padding: 4px 15px;
            border-radius: 5px;
            font-size: 11px;
            width: 50%;
            color: var(--text-main);
        }

        .clock {
            font-size: 64px;
            margin-top: 40px;
            font-weight: 300;
        }

        .date {
            font-size: 14px;
            color: var(--text-date);
            margin-bottom: 40px;
        }

        .links-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-main);
            font-size: 12px;
        }

        .circle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            margin-bottom: 8px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .item:hover .circle img {
            transform: scale(1.2);
        }

        .footer-badge {
            display: inline-block;
            background: var(--border-color);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 10px;
        }

        /* Botão Alternador de Tema */
        .theme-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background: var(--bg-window);
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        .theme-btn:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <!-- Calendário no Canto Superior Esquerdo -->
    <div class="calendar-widget">
        <div id="calendar-header" class="calendar-header"></div>
        <div id="calendar-grid" class="calendar-grid"></div>
    </div>

    <!-- Status do Spotify no Canto Superior Direito -->
    <div class="spotify-widget">
        <div class="spotify-header">
            <span>SPOTIFY STATUS</span>
            <i class="fa-brands fa-spotify"></i>
        </div>
        <div class="spotify-content">
            <img id="spotify-cover" class="spotify-cover" src="https://via.placeholder.com/48" alt="Capa">
            <div class="spotify-info">
                <span id="spotify-title" class="spotify-title">Offline</span>
                <span id="spotify-artist" class="spotify-artist">Nenhuma música tocando</span>
                <div class="spotify-progress-bar">
                    <div id="spotify-progress" class="spotify-progress"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Janela Principal -->
    <div class="window">
        <div class="top-bar">
            <div class="dots">
                <div class="dot red"></div>
                <div class="dot yellow"></div>
                <div class="dot green"></div>
            </div>
            <div class="search-bar">www.owiwan.com</div>
        </div>

        <div id="clock" class="clock">00:00</div>
        <div id="date" class="date">carregando...</div>

        <div class="links-container">
            <a href="about.html" class="item">
                <div class="circle"><img src="imagens/img1.jpg" alt="about"></div>
                <span>about</span>
            </a>
            <a href="likes.html" class="item">
                <div class="circle"><img src="imagens/img2.jpg" alt="likes"></div>
                <span>likes</span>
            </a>
            <a href="#" class="item">
                <div class="circle"><img src="imagens/img3.jpg" alt="..."></div>
                <span>...</span>
            </a>
            <a href="#" class="item">
                <div class="circle"><img src="imagens/img4.jpg" alt="social"></div>
                <span>social medias</span>
            </a>
        </div>

        <div class="footer-badge">made by owivan</div>
    </div>

    <button id="theme-toggle" class="theme-btn"><i class="fa-solid fa-moon"></i></button>

    <script src="script.js"></script>
</body>
</html>
