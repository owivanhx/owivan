<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>animes que vince gosta</title>
    <link rel="icon" type="image/x-icon" href="zackchibi.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-body: #ffffff;
            --bg-window: #ffffff;
            --bg-card: #f5f5f5;
            --bg-card-hover: #e8e8e8;
            --text-main: #333333;
            --text-date: #888888;
            --border-color: #e0e0e0;
            --highlight-bg: #333333;
            --highlight-text: #ffffff;
        }

        body.dark-mode {
            --bg-body: #121212;
            --bg-window: #1e1e1e;
            --bg-card: #141414;
            --bg-card-hover: #282828;
            --text-main: #e0e0e0;
            --text-date: #aaaaaa;
            --border-color: #333333;
            --highlight-bg: #ffffff;
            --highlight-text: #121212;
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-body);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-main);
            transition: background 0.3s ease;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Janela Principal */
        .window {
            width: 100%;
            max-width: 900px;
            background: var(--bg-window);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 1px solid var(--border-color);
            overflow: hidden;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .top-bar {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            border-bottom: 1px solid var(--border-color);
            position: relative;
        }

        .dots { display: flex; gap: 6px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .red { background: #ff5f56; }
        .yellow { background: #ffbd2e; }
        .green { background: #27c93f; }

        .back-btn {
            color: var(--text-main);
            text-decoration: none;
            font-size: 13px;
            margin-left: 15px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: opacity 0.2s ease;
        }

        .back-btn:hover {
            opacity: 0.7;
        }

        .search-bar {
            background: var(--border-color);
            margin: 0 auto;
            padding: 4px 15px;
            border-radius: 5px;
            font-size: 11px;
            width: 40%;
            color: var(--text-main);
            text-align: center;
        }

        /* Layout do Catálogo */
        .catalog-container {
            display: flex;
            gap: 24px;
            padding: 24px;
        }

        /* Grade de Animes */
        .games-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(115px, 1fr));
            gap: 20px 18px;
            max-height: 440px;
            overflow-y: auto;
            padding-right: 12px;
            box-sizing: border-box;
        }

        .game-card {
            width: 100%;
            aspect-ratio: 3 / 4;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid var(--border-color);
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            background-color: var(--bg-card);
        }

        .game-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .game-card:hover {
            transform: translateY(-4px);
            border-color: var(--text-main);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        /* Scrollbar Interna */
        .games-grid::-webkit-scrollbar {
            width: 6px;
        }

        .games-grid::-webkit-scrollbar-track {
            background: var(--bg-card);
            border-radius: 4px;
        }

        .games-grid::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        /* Painel Lateral */
        .details-sidebar {
            width: 260px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            flex-shrink: 0;
        }

        .sidebar-box {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .box-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-date);
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        #preview-cover {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 10px;
            background-color: var(--border-color);
        }

        #game-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
            margin: 0 0 4px 0;
        }

        #game-developer {
            font-size: 0.8rem;
            color: var(--text-date);
            margin: 0;
        }

        #game-description {
            font-size: 0.8rem;
            color: var(--text-main);
            line-height: 1.4;
            margin: 0;
        }

        .window-footer {
            text-align: center;
            padding: 10px 0 15px 0;
        }

        .footer-badge {
            display: inline-block;
            background: var(--border-color);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 10px;
        }

        /* Botão Alternador de Tema */
        .theme-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background: var(--bg-window);
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        .theme-btn:hover {
            transform: scale(1.1);
        }

        /* Responsividade */
        @media (max-width: 768px) {
            .catalog-container {
                flex-direction: column;
            }

            .details-sidebar {
                width: 100%;
            }

            .games-grid {
                max-height: 320px;
            }

            .search-bar {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- Janela Principal -->
    <div class="window">
        <div class="top-bar">
            <div class="dots">
                <div class="dot red"></div>
                <div class="dot yellow"></div>
                <div class="dot green"></div>
            </div>
            <a href="likes.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Voltar</a>
            <div class="search-bar">www.owiwan.com/animes</div>
        </div>

        <div class="catalog-container">
            <!-- Grade de Capas dos Animes -->
            <div class="games-grid">
                <div class="game-card" onclick="selectAnime('Ron Kamonohashi\'s Forbidden Deductions', 'diomedéa', 'animes/Kamonohashi Ron no Kindan Su...jpg', 'Um detetive particular excêntrico e um policial ingênuo se unem para resolver os mistérios mais sombrios.')">
                    <img src="animes/Kamonohashi Ron no Kindan Su...jpg" alt="Ron Kamonohashi">
                </div>
                <div class="game-card" onclick="selectAnime('Blue Period', 'Seven Arcs', 'animes/blueperiod.jpg', 'Um estudante do ensino médio descobre a paixão pela pintura e busca entrar na universidade de artes.')">
                    <img src="animes/blueperiod.jpg" alt="Blue Period">
                </div>
                <div class="game-card" onclick="selectAnime('Bungou Stray Dogs', 'Bones', 'animes/bsd.jpg', 'Indivíduos com poderes sobrenaturais baseados em autores famosos resolvem mistérios na Agência de Detetives.')">
                    <img src="animes/bsd.jpg" alt="Bungou Stray Dogs">
                </div>
                <div class="game-card" onclick="selectAnime('Buddy Daddies', 'P.A. Works', 'animes/buddydaddies.jpg', 'Dois assassinos profissionais se veem forçados a cuidar da filha de quatro anos de um chefe do crime.')">
                    <img src="animes/buddydaddies.jpg" alt="Buddy Daddies">
                </div>
                <div class="game-card" onclick="selectAnime('Death Note', 'Madhouse', 'animes/deathnote.jpg', 'Um estudante encontra um caderno capaz de matar qualquer pessoa cujo nome seja escrito nele.')">
                    <img src="animes/deathnote.jpg" alt="Death Note">
                </div>
                <div class="game-card" onclick="selectAnime('Durarara!!', 'Brain\'s Base', 'animes/drrr.jpg', 'Eventos misteriosos e gangs urbanas se entrelaçam no agitado distrito de Ikebukuro.')">
                    <img src="animes/drrr.jpg" alt="Durarara!!">
                </div>
                <div class="game-card" onclick="selectAnime('Dr. STONE', 'TMS Entertainment', 'animes/drstone.jpg', 'Milhares de anos após a humanidade ser petrificada, um prodígio da ciência tenta reconstruir a civilização.')">
                    <img src="animes/drstone.jpg" alt="Dr. STONE">
                </div>
                <div class="game-card" onclick="selectAnime('Fullmetal Alchemist', 'Bones', 'animes/fullmetal.jpg', 'Dois irmãos alquimistas buscam a Pedra Filosofal para recuperar seus corpos após um ritual fracassado.')">
                    <img src="animes/fullmetal.jpg" alt="Fullmetal Alchemist">
                </div>
                <div class="game-card" onclick="selectAnime('Haikyu!!', 'Production I.G', 'animes/haikyuu.jpg', 'A jornada do time de vôlei do colégio Karasuno em busca do topo do campeonato nacional.')">
                    <img src="animes/haikyuu.jpg" alt="Haikyu!!">
                </div>
                <div class="game-card" onclick="selectAnime('Toilet-bound Hanako-kun', 'Lerche', 'animes/hanakokun.jpg', 'Uma estudante faz um pacto com o espírito de Hanako-kun, o sétimo mistério da escola.')">
                    <img src="animes/hanakokun.jpg" alt="Hanako-kun">
                </div>
                <div class="game-card" onclick="selectAnime('Loveless', 'J.C.Staff', 'animes/loveless.jpg', 'Ritsuka investiga a morte misteriosa de seu irmão enquanto se envolve no mundo de batalhas verbais.')">
                    <img src="animes/loveless.jpg" alt="Loveless">
                </div>
                <div class="game-card" onclick="selectAnime('Mashle: Magic and Muscles', 'A-1 Pictures', 'animes/mashle.jpg', 'Em um mundo onde a magia é tudo, um jovem sem poderes usa sua força física bruta para superar os magos.')">
                    <img src="animes/mashle.jpg" alt="Mashle">
                </div>
                <div class="game-card" onclick="selectAnime('The Millionaire Detective', 'CloverWorks', 'animes/millionairedetective.jpg', 'Um herdeiro milionário usa recursos ilimitados para resolver crimes ao lado de um parceiro rígido.')">
                    <img src="animes/millionairedetective.jpg" alt="The Millionaire Detective">
                </div>
                <div class="game-card" onclick="selectGame('One Piece', 'Toei Animation', 'animes/onepiece.jpg', 'Monkey D. Luffy e sua tripulação navegam pelos mares em busca do lendário tesouro One Piece.')">
                    <img src="animes/onepiece.jpg" alt="One Piece">
                </div>
                <div class="game-card" onclick="selectAnime('Seraph of the End', 'Wit Studio', 'animes/owarinseraph.jpg', 'Em um mundo pós-apocalíptico dominado por vampiros, humanos lutam pela própria sobrevivência.')">
                    <img src="animes/owarinseraph.jpg" alt="Seraph of the End">
                </div>
                <div class="game-card" onclick="selectAnime('Sakamoto Days', 'TMS Entertainment', 'animes/sakamotodays.jpg', 'Um lendário ex-assassino de aluguel tenta viver uma vida tranquila gerenciando uma mercearia.')">
                    <img src="animes/sakamotodays.jpg" alt="Sakamoto Days">
                </div>
                <div class="game-card" onclick="selectAnime('Servamp', 'Brain\'s Base', 'animes/servamp.jpg', 'Um estudante forma acidentalmente um contrato com um vampiro preguiçoso chamado Kuro.')">
                    <img src="animes/servamp.jpg" alt="Servamp">
                </div>
                <div class="game-card" onclick="selectAnime('Shiki', 'Daume', 'animes/shiki.jpg', 'Estranhas mortes começam a assolar uma pequena vila isolada com a chegada de novos moradores.')">
                    <img src="animes/shiki.jpg" alt="Shiki">
                </div>
                <div class="game-card" onclick="selectAnime('SK8 the Infinity', 'Bones', 'animes/sk8.jpg', 'Skatistas participam de corridas clandestinas de alto risco conhecidas como S.')">
                    <img src="animes/sk8.jpg" alt="SK8 the Infinity">
                </div>
                <div class="game-card" onclick="selectAnime('Terror in Resonance', 'MAPPA', 'animes/terroriresonance.jpg', 'Dois garotos misteriosos operam sob o nome Sphinx para expor segredos sombrios de Tóquio.')">
                    <img src="animes/terroriresonance.jpg" alt="Terror in Resonance">
                </div>
                <div class="game-card" onclick="selectAnime('Trigun', 'Madhouse / Orange', 'animes/triguns.jpg', 'Vash the Stampede é um pistoleiro pacifista com uma enorme recompensa por sua cabeça.')">
                    <img src="animes/triguns.jpg" alt="Trigun">
                </div>
                <div class="game-card" onclick="selectAnime('Tsurune', 'Kyoto Animation', 'animes/tshd.jpg', 'Jovens do clube de arqueria buscam superar desafios pessoais e alcançar o topo do arquearia kyudo.')">
                    <img src="animes/tshd.jpg" alt="Tsurune">
                </div>
                <div class="game-card" onclick="selectAnime('The Case Study of Vanitas', 'Bones', 'animes/vanitasncarte.jpg', 'Um humano com o Livro de Vanitas se une a um vampiro para curar a maldição que afeta os de sua espécie.')">
                    <img src="animes/vanitasncarte.jpg" alt="The Case Study of Vanitas">
                </div>
                <div class="game-card" onclick="selectAnime('Wind Breaker', 'CloverWorks', 'animes/windbreaker.jpg', 'Estudantes de uma escola de delinquentes usam seus punhos para proteger a cidade.')">
                    <img src="animes/windbreaker.jpg" alt="Wind Breaker">
                </div>
                <div class="game-card" onclick="selectAnime('Yuri!!! on Ice', 'MAPPA', 'animes/yurinoice.jpg', 'Um patinador no gelo busca recuperar sua paixão pelo esporte sob a orientação de um campeão lendário.')">
                    <img src="animes/yurinoice.jpg" alt="Yuri!!! on Ice">
                </div>
            </div>

            <!-- Painel Lateral -->
            <div class="details-sidebar">
                <div class="sidebar-box">
                    <span class="box-label">Anime Selecionado</span>
                    <img id="preview-cover" src="animes/bsd.jpg" alt="Capa do Anime">
                    <h3 id="game-title">Bungou Stray Dogs</h3>
                    <p id="game-developer">Bones</p>
                </div>

                <div class="sidebar-box">
                    <span class="box-label">Sobre</span>
                    <p id="game-description">Indivíduos com poderes sobrenaturais baseados em autores famosos resolvem mistérios na Agência de Detetives.</p>
                </div>
            </div>
        </div>

        <div class="window-footer">
            <div class="footer-badge">made by owivan</div>
        </div>
    </div>

    <!-- Botão de Tema -->
    <button id="theme-toggle" class="theme-btn"><i class="fa-solid fa-moon"></i></button>

    <script>
        function selectAnime(title, studio, coverUrl, description) {
            document.getElementById('game-title').textContent = title;
            document.getElementById('game-developer').textContent = studio;
            document.getElementById('preview-cover').src = coverUrl;
            document.getElementById('game-description').textContent = description;
        }
    </script>
    <script src="script.js"></script>
</body>
</html>
